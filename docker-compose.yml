# 로컬 개발용 PostgreSQL. 접속 정보는 .env에서 읽는다 (.env.example 참고).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cocotrade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cocotrade}
      POSTGRES_DB: ${POSTGRES_DB:-cocotrade}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:
